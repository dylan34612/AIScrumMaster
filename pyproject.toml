[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenticscrum"
version = "0.1.0"
description = "Local AI scrum master for meeting notes and Azure DevOps work items."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "apscheduler",
  "azure-identity",
  "fastapi",
  "httpx",
  "jinja2",
  "langchain",
  "langchain-openai",
  "msal",
  "openai",
  "pydantic",
  "pydantic-settings",
  "python-docx",
  "python-dotenv",
  "python-multipart",
  "pyyaml",
  "sqlalchemy",
  "structlog",
  "tenacity",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "debugpy",
  "freezegun",
  "pytest",
  "pytest-asyncio",
  "respx",
]

[project.scripts]
agenticscrum = "agenticscrum.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticscrum"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
