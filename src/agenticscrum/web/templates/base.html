<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agentic Scrum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      :root {
        --as-radius: 0.65rem;
        --as-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      details summary { cursor: pointer; }
      .table > :not(caption) > * > * { vertical-align: top; }

      .card {
        box-shadow: var(--as-shadow);
        border-radius: var(--as-radius);
        border-color: rgba(0, 0, 0, 0.06);
      }

      .card-header {
        background-color: var(--bs-tertiary-bg);
        border-bottom-color: rgba(0, 0, 0, 0.06);
        padding: .65rem .9rem;
      }

      .card-body {
        padding: .85rem .9rem;
      }

      .table {
        --bs-table-cell-padding-y: .4rem;
        --bs-table-cell-padding-x: .55rem;
        font-size: .925rem;
      }

      .as-meta {
        color: var(--bs-secondary-color);
        font-size: .8125rem;
      }

      .as-pre {
        white-space: pre-wrap;
        background: var(--bs-tertiary-bg);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: .5rem;
        padding: .55rem .65rem;
      }

      .as-badge {
        font-weight: 600;
        letter-spacing: .2px;
      }

      .as-divider {
        border-top: 1px solid rgba(0, 0, 0, 0.08);
      }

      /* Chat — denser, fuller-width workspace locked to the viewport */
      .as-chat-bubble {
        max-width: min(96ch, 100%);
      }
      .as-chat-bubble-user {
        background: var(--bs-primary);
        color: var(--bs-white);
      }
      .as-chat-bubble-assistant {
        background: var(--bs-body-bg);
      }
      .as-chat-bubble-system {
        background: var(--bs-tertiary-bg);
      }
      .as-chat-md p:last-child { margin-bottom: 0; }
      .as-chat-md a { text-decoration: underline; }

      body.as-chat-page {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      body.as-chat-page > main.as-chat-main-wrap {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-top: .65rem;
        padding-bottom: .65rem;
        overflow: hidden;
      }
      .as-chat-layout {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: .5rem;
      }
      .as-chat-header { flex: 0 0 auto; }
      .as-chat-row {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0;
        --bs-gutter-x: .85rem;
        --bs-gutter-y: .85rem;
      }
      .as-chat-row > [class*="col-"] {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .as-chat-main {
        min-height: 0;
        height: 100%;
      }
      .min-h-0 { min-height: 0 !important; }
      .as-chat-pane {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .as-chat-pane > #chat-messages {
        min-height: 0;
      }
      .as-chat-composer {
        flex: 0 0 auto;
      }
      .as-chat-sidebar {
        max-height: 100%;
        height: 100%;
        overflow: auto;
      }
      .as-chat-sidebar .table {
        --bs-table-cell-padding-y: .35rem;
        --bs-table-cell-padding-x: .45rem;
        font-size: .875rem;
      }
      .as-chat-sidebar .fw-semibold {
        font-size: .9rem;
        line-height: 1.25;
      }
      @media (max-width: 1199.98px) {
        body.as-chat-page {
          height: auto;
          overflow: auto;
        }
        body.as-chat-page > main.as-chat-main-wrap {
          overflow: visible;
          display: block;
        }
        .as-chat-layout,
        .as-chat-row,
        .as-chat-main {
          height: auto;
          min-height: 0;
        }
        .as-chat-pane {
          min-height: 45vh;
          max-height: 55vh;
        }
        .as-chat-sidebar {
          height: auto;
          max-height: 50vh;
        }
      }
      .as-typing {
        display: inline-flex;
        align-items: center;
        gap: .25rem;
        color: var(--bs-secondary-color);
        font-size: .875rem;
      }
      .as-typing span {
        width: .4rem;
        height: .4rem;
        border-radius: 50%;
        background: var(--bs-secondary-color);
        animation: as-bounce 1.2s infinite ease-in-out;
      }
      .as-typing span:nth-child(2) { animation-delay: .15s; }
      .as-typing span:nth-child(3) { animation-delay: .3s; }
      @keyframes as-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: .4; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
      .htmx-indicator { display: none; }
      .htmx-request.htmx-indicator, .htmx-request .htmx-indicator { display: block; }
      .as-autocomplete {
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        top: 100%;
        max-height: 12rem;
        overflow: auto;
      }
    </style>
  </head>
  <body class="bg-light {% block body_class %}{% endblock %}">
    {% set path = request.url.path if request else "/" %}
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top flex-shrink-0">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Agentic Scrum</a>
        <div class="navbar-nav">
          <a class="nav-link {% if path == '/' %}active{% endif %}" {% if path == '/' %}aria-current="page"{% endif %} href="/">Dashboard</a>
          <a class="nav-link {% if path.startswith('/chat') %}active{% endif %}" {% if path.startswith('/chat') %}aria-current="page"{% endif %} href="/chat">Chat</a>
          <a class="nav-link {% if path.startswith('/ingestion') %}active{% endif %}" {% if path.startswith('/ingestion') %}aria-current="page"{% endif %} href="/ingestion/runs">Runs</a>
        </div>
      </div>
    </nav>
    <main class="container-fluid px-3 px-lg-4 py-3 {% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
